

server {
    listen 80;

    # Sert les fichiers React buildés
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Redirige les appels /api/* vers le conteneur de l'API
    # (évite le mélange de ports dans le navigateur du client)
    location /api/ {
        proxy_pass http://ecodelta_ai:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
